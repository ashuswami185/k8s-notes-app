apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-backend
  labels:
    app: notes-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-backend
  template:
    metadata:
      labels:
        app: notes-backend
    spec:
      containers:
      - name: notes-backend
        # Replace with your actual Docker image, e.g., username/notesapp-backend:latest
        image: notes-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: DB_URI
          # For production, it's better to use a Secret, but setting it here for testing:
          value: "your postgres sql string"
---
apiVersion: v1
kind: Service
metadata:
  name: notes-backend-svc
spec:
  selector:
    app: notes-backend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP
